<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drain Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6FAF8">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drain Log">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F6FAF8; --surface:#FFFFFF; --ink:#23302B; --ink-2:#5E6E67; --ink-3:#98A6A0; --line:rgba(35,48,43,.09);
  --mint:#8FD3BA; --mint-deep:#2E8467; --mint-soft:#E3F4ED; --peach:#FFB997; --peach-soft:#FFEDE3; --peach-deep:#C4633F;
  --lav-soft:#EEEBFB; --lav-deep:#6555B8; --danger:#C94A5E; --danger-soft:#FBE8EB;
  --r:16px; --shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(110px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.sub{color:var(--ink-3);font-size:14px}
.link{color:var(--mint-deep);font-weight:600;font-size:15px}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.tile span{display:block;font-size:11.5px;white-space:nowrap;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tile b{display:block;font-size:24px;font-weight:750;margin-top:2px;white-space:nowrap}
.tile b small{font-size:14px;font-weight:600;color:var(--ink-3)}
.tile.total{background:var(--mint-soft)}
.tile.total b{color:var(--mint-deep)}
.seg{display:flex;background:rgba(35,48,43,.06);border-radius:11px;padding:3px;margin:18px 0 12px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:650;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.t{font-weight:700}
td .d{font-weight:600;white-space:nowrap}
td .w{display:block;font-size:12.5px;color:var(--ink-3)}
td.dash{color:var(--ink-3)}
tbody tr.tap{cursor:pointer}
tbody tr.tap:active{background:var(--bg)}
.dayhead td{background:#FAFCFB;font-size:13px;font-weight:700;color:var(--ink-2);padding:8px 14px}
.note{display:block;font-size:12.5px;color:var(--ink-2);text-align:left;margin-top:2px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.fab{position:fixed;right:max(20px,calc(50% - 360px));bottom:calc(24px + var(--safe-b));width:62px;height:62px;border-radius:50%;
  background:var(--mint-deep);color:#fff;font-size:34px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 24px rgba(46,132,103,.35);z-index:10}
.fab:active{transform:scale(.95)}
.scrim{position:fixed;inset:0;background:rgba(20,30,25,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-radius:22px 22px 0 0;max-width:560px;margin:0 auto;
  padding:10px 18px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:20px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:12px 0 6px}
.in{width:100%;height:50px;border:1px solid rgba(35,48,43,.16);border-radius:13px;padding:0 14px;font-size:18px;background:var(--surface);outline:none}
.in:focus{border-color:var(--mint);box-shadow:0 0 0 4px rgba(143,211,186,.3)}
textarea.in{height:70px;padding:12px 14px;font-size:16px;resize:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.unit{position:relative}
.unit .in{padding-right:44px}
.unit span{position:absolute;right:14px;top:15px;color:var(--ink-3);font-weight:600}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:14px;font-weight:700;font-size:17px;margin-top:18px}
.btn.primary{background:var(--mint-deep);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink-2);margin-top:10px}
.btn.danger{background:var(--danger-soft);color:var(--danger);margin-top:10px}
.btn[disabled]{opacity:.5}
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth .box{width:100%;max-width:380px;text-align:center}
.auth .in{margin-top:10px}
.auth p{color:var(--ink-2)}
.logo{width:64px;height:64px;border-radius:20px;background:var(--mint-soft);display:grid;place-items:center;margin:0 auto 12px;color:var(--mint-deep)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,16px);opacity:0;background:rgba(35,48,43,.94);color:#fff;
  padding:11px 16px;border-radius:12px;font-size:15px;transition:.3s;z-index:40;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--peach-soft);color:var(--peach-deep);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="auth" id="auth" hidden>
  <div class="box">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg></div>
    <h1>Drain Log</h1>
    <p id="authMsg">Sign in with your Eckert Haus Kitchen account.</p>
    <form id="authForm">
      <input class="in" id="email" type="email" autocomplete="username" placeholder="Email" required>
      <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary" id="authBtn" type="submit">Sign in</button>
    </form>
  </div>
</section>

<main class="wrap" id="app" hidden>
  <div class="top">
    <div><h1>Drain Log</h1><div class="sub" id="tzNote">All times Central (CT)</div></div>
    <button class="link" id="exportBtn">Export CSV</button>
  </div>
  <div id="demoBanner" class="banner" hidden>Demo mode, with sample entries that aren't saved.</div>

  <div class="today" aria-label="Today so far">
    <div class="tile"><span>Left today</span><b class="num" id="tL">0 <small>mL</small></b></div>
    <div class="tile"><span>Right today</span><b class="num" id="tR">0 <small>mL</small></b></div>
    <div class="tile total"><span>Total today</span><b class="num" id="tT">0 <small>mL</small></b></div>
  </div>

  <div class="seg" role="group" aria-label="View">
    <button id="vDay" aria-pressed="true">By day</button>
    <button id="vLog" aria-pressed="false">Log</button>
  </div>

  <div class="card" id="dayView"></div>
  <div class="card" id="logView" hidden></div>
  <p class="sub" style="text-align:center;margin-top:18px"><button class="link" id="signOut" style="color:var(--ink-3);font-weight:500">Sign out</button></p>
</main>

<button class="fab" id="fab" aria-label="New entry" hidden>+</button>
<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet" autocomplete="off">
  <div class="grab"></div>
  <h2 id="sheetTitle">New entry</h2>
  <label class="f" for="when">Date &amp; time (Central)</label>
  <input class="in" id="when" type="datetime-local" required>
  <div class="pair">
    <div><label class="f" for="left">Left drain</label><div class="unit"><input class="in num" id="left" inputmode="decimal" placeholder="0"><span>mL</span></div></div>
    <div><label class="f" for="right">Right drain</label><div class="unit"><input class="in num" id="right" inputmode="decimal" placeholder="0"><span>mL</span></div></div>
  </div>
  <div class="hint">Leave a side blank if you didn't empty it.</div>
  <label class="f" for="note">Note (optional)</label>
  <textarea class="in" id="note" placeholder="Color, clots, anything to tell the doctor…"></textarea>
  <button class="btn primary" id="saveBtn" type="submit">Save</button>
  <button class="btn danger" id="delBtn" type="button" hidden>Delete entry</button>
  <button class="btn ghost" id="cancelBtn" type="button">Cancel</button>
</form>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
const TZ = "America/Chicago";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let toastT; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); };

// ---------- Central-time helpers (DST-aware: CST in winter, CDT in summer) ----------
const partsCT = (d) => Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: TZ, hourCycle: "h23",
  year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" })
  .formatToParts(d).filter((p) => p.type !== "literal").map((p) => [p.type, p.value]));
const offsetMs = (d) => { const p = partsCT(d); return Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - (d.getTime() - d.getMilliseconds()); };
/** "2026-09-26T14:30" (Central wall time) → Date */
function fromCTLocal(v) {
  const [date, time] = v.split("T"); const [y, m, d] = date.split("-").map(Number); const [hh, mm] = time.split(":").map(Number);
  const guess = Date.UTC(y, m - 1, d, hh, mm);
  let t = guess - offsetMs(new Date(guess)); t = guess - offsetMs(new Date(t)); // second pass settles DST edges
  return new Date(t);
}
/** Date → "2026-09-26T14:30" in Central */
const toCTLocal = (d) => { const p = partsCT(d); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`; };
const dayKey = (d) => { const p = partsCT(d); return `${p.year}-${p.month}-${p.day}`; };
const fmtDay = (key) => new Date(key + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
const fmtTime = (d) => d.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", timeZoneName: "short" });
const ml = (n) => (n == null || n === "" ? "" : (Math.round(n * 10) / 10).toLocaleString("en-US"));
const num = (v) => { const s = String(v).trim().replace(",", "."); if (!s) return null; const n = Number(s); return Number.isFinite(n) && n >= 0 ? Math.round(n * 10) / 10 : NaN; };

// ---------- data layer ----------
const demo = new URLSearchParams(location.search).has("demo") || SUPABASE_URL.includes("YOUR-");
let sb, rows = [];
async function initStore() {
  if (demo) {
    const now = Date.now(), h = 36e5;
    rows = [[2, 20, 25], [9, 30, 35, "Pinkish, thin"], [14, 25, 30], [26, 40, 45], [33, 35, 40], [38, 45, 50], [50, 55, 60], [57, 50, 45]]
      .map(([ago, l, r, note], i) => ({ id: "d" + i, logged_at: new Date(now - ago * h).toISOString(), left_ml: l, right_ml: r, note: note || null }));
    $("#demoBanner").hidden = false;
    return;
  }
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true } });
}
const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
async function load() {
  if (demo) return;
  const out = [];
  for (let from = 0; ; from += 1000) {
    const page = ok(await sb.from("drain_log").select("id,logged_at,left_ml,right_ml,note").order("logged_at", { ascending: false }).range(from, from + 999));
    out.push(...page); if (page.length < 1000) break;
  }
  rows = out;
}
async function save(entry) {
  if (demo) { const i = rows.findIndex((r) => r.id === entry.id); i >= 0 ? rows.splice(i, 1, entry) : rows.push({ ...entry, id: "d" + Date.now() }); return; }
  const { id, ...fields } = entry;
  ok(id ? await sb.from("drain_log").update(fields).eq("id", id) : await sb.from("drain_log").insert(fields));
}
async function remove(id) { if (demo) { rows = rows.filter((r) => r.id !== id); return; } ok(await sb.from("drain_log").delete().eq("id", id)); }

// ---------- render ----------
let view = "day";
function rollup() {
  const m = new Map();
  for (const r of rows) {
    const k = dayKey(new Date(r.logged_at));
    const d = m.get(k) || { day: k, left: 0, right: 0, n: 0, hasL: false, hasR: false };
    if (r.left_ml != null) { d.left += +r.left_ml; d.hasL = true; }
    if (r.right_ml != null) { d.right += +r.right_ml; d.hasR = true; }
    d.n++; m.set(k, d);
  }
  return [...m.values()].sort((a, b) => b.day.localeCompare(a.day));
}
function render() {
  const days = rollup(), today = dayKey(new Date()), t = days.find((d) => d.day === today) || { left: 0, right: 0 };
  $("#tL").innerHTML = `${ml(t.left)} <small>mL</small>`; $("#tR").innerHTML = `${ml(t.right)} <small>mL</small>`;
  $("#tT").innerHTML = `${ml(t.left + t.right)} <small>mL</small>`;
  $("#tzNote").textContent = `All times Central (${new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "short" }).formatToParts(new Date()).find((p) => p.type === "timeZoneName").value})`;

  const empty = `<div class="empty">No entries yet. Tap <b>+</b> to log the first one.</div>`;
  $("#dayView").innerHTML = !days.length ? empty : `<table><thead><tr><th>Day</th><th>Left</th><th>Right</th><th>Total mL</th></tr></thead><tbody>
    ${days.map((d) => `<tr><td><span class="d">${fmtDay(d.day)}</span><span class="w">${d.n} entr${d.n === 1 ? "y" : "ies"}${d.day === today ? " · today" : ""}</span></td>
      <td>${d.hasL ? ml(d.left) : "—"}</td><td>${d.hasR ? ml(d.right) : "—"}</td><td class="t">${ml(d.left + d.right)}</td></tr>`).join("")}</tbody></table>`;

  const sorted = [...rows].sort((a, b) => b.logged_at.localeCompare(a.logged_at));
  let last = "", body = "";
  for (const r of sorted) {
    const d = new Date(r.logged_at), k = dayKey(d);
    if (k !== last) { last = k; body += `<tr class="dayhead"><td colspan="4">${fmtDay(k)}</td></tr>`; }
    const tot = (+r.left_ml || 0) + (+r.right_ml || 0);
    body += `<tr class="tap" data-id="${r.id}"><td>${fmtTime(d)}${r.note ? `<span class="note">${esc(r.note)}</span>` : ""}</td>
      <td class="${r.left_ml == null ? "dash" : ""}">${r.left_ml == null ? "—" : ml(r.left_ml)}</td>
      <td class="${r.right_ml == null ? "dash" : ""}">${r.right_ml == null ? "—" : ml(r.right_ml)}</td><td class="t">${ml(tot)}</td></tr>`;
  }
  $("#logView").innerHTML = !rows.length ? empty : `<table><thead><tr><th>Time</th><th>Left</th><th>Right</th><th>Total</th></tr></thead><tbody>${body}</tbody></table>`;
  $("#dayView").hidden = view !== "day"; $("#logView").hidden = view !== "log";
  $("#vDay").setAttribute("aria-pressed", view === "day"); $("#vLog").setAttribute("aria-pressed", view === "log");
}

// ---------- entry sheet ----------
let editing = null;
function openSheet(row = null) {
  editing = row;
  $("#sheetTitle").textContent = row ? "Edit entry" : "New entry";
  $("#when").value = toCTLocal(row ? new Date(row.logged_at) : new Date());
  $("#left").value = row?.left_ml ?? ""; $("#right").value = row?.right_ml ?? ""; $("#note").value = row?.note ?? "";
  $("#delBtn").hidden = !row; $("#delBtn").dataset.confirm = ""; $("#delBtn").textContent = "Delete entry";
  $("#sheet").classList.add("open"); $("#scrim").classList.add("show");
  if (!row) setTimeout(() => $("#left").focus(), 350);
}
function closeSheet() { $("#sheet").classList.remove("open"); $("#scrim").classList.remove("show"); document.activeElement?.blur(); }

$("#sheet").addEventListener("submit", async (e) => {
  e.preventDefault();
  const left = num($("#left").value), right = num($("#right").value);
  if (Number.isNaN(left) || Number.isNaN(right)) return toast("Amounts must be numbers (mL)");
  if (left == null && right == null) return toast("Enter at least one drain amount");
  if (!$("#when").value) return toast("Pick a date and time");
  const entry = { ...(editing ? { id: editing.id } : {}), logged_at: fromCTLocal($("#when").value).toISOString(), left_ml: left, right_ml: right, note: $("#note").value.trim() || null };
  const b = $("#saveBtn"); b.disabled = true;
  try { await save(entry); await load(); render(); closeSheet(); toast(editing ? "Entry updated" : "Entry saved"); }
  catch (er) { toast(er.message); } finally { b.disabled = false; }
});
$("#delBtn").addEventListener("click", async () => {
  const b = $("#delBtn");
  if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = "Tap again to delete"; return; }
  try { await remove(editing.id); await load(); render(); closeSheet(); toast("Entry deleted"); } catch (er) { toast(er.message); }
});
$("#cancelBtn").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);
$("#fab").addEventListener("click", () => openSheet());
$("#logView").addEventListener("click", (e) => { const tr = e.target.closest("tr[data-id]"); if (tr) openSheet(rows.find((r) => String(r.id) === tr.dataset.id)); });
$("#vDay").addEventListener("click", () => { view = "day"; render(); });
$("#vLog").addEventListener("click", () => { view = "log"; render(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

$("#exportBtn").addEventListener("click", () => {
  const sorted = [...rows].sort((a, b) => a.logged_at.localeCompare(b.logged_at));
  const lines = [["Date (CT)", "Time (CT)", "Left (mL)", "Right (mL)", "Total (mL)", "Note"]];
  for (const r of sorted) { const d = new Date(r.logged_at);
    lines.push([dayKey(d), fmtTime(d), r.left_ml ?? "", r.right_ml ?? "", (+r.left_ml || 0) + (+r.right_ml || 0), r.note ?? ""]); }
  lines.push([]); lines.push(["Daily totals"]); lines.push(["Date (CT)", "Left (mL)", "Right (mL)", "Total (mL)", "Entries"]);
  for (const d of rollup().reverse()) lines.push([d.day, d.left, d.right, d.left + d.right, d.n]);
  const csv = lines.map((l) => l.map((v) => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `drain-log-${dayKey(new Date())}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

// ---------- auth, boot, sync ----------
async function enterApp() {
  if (!demo && ok(await sb.rpc("is_member")) !== true) { $("#authMsg").textContent = "This account isn't on the family list. Add its email to allowed_emails in Supabase."; return showAuth(); }
  await load(); render();
  $("#auth").hidden = true; $("#app").hidden = false; $("#fab").hidden = false;
  if (!demo) {
    const refresh = async () => { try { await load(); render(); } catch {} };
    sb.channel("drain-sync").on("postgres_changes", { event: "*", schema: "public", table: "drain_log" }, refresh).subscribe();
    document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && refresh());
  }
  setInterval(render, 60_000); // keeps "today" correct past midnight
}
function showAuth() { $("#auth").hidden = false; $("#app").hidden = true; $("#fab").hidden = true; }
$("#authForm").addEventListener("submit", async (e) => {
  e.preventDefault(); const b = $("#authBtn"); b.disabled = true;
  try { ok(await sb.auth.signInWithPassword({ email: $("#email").value.trim().toLowerCase(), password: $("#pw").value })); await enterApp(); }
  catch (er) { toast(/invalid login/i.test(er.message) ? "That email and password don't match." : er.message); }
  finally { b.disabled = false; }
});
$("#signOut").addEventListener("click", async () => { if (!demo) await sb.auth.signOut(); location.reload(); });

(async () => {
  try {
    await initStore();
    if (demo) return enterApp();
    const { data } = await sb.auth.getSession();
    data.session ? await enterApp() : showAuth();
  } catch (e) { document.body.innerHTML = `<div class="empty">Couldn't start: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
